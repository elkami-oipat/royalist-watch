name: bassrig-watch

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bassrig-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Watch for new listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_FILE: state/bassrig-seen.json
          WATCH_NAME: BassRig
          SCAN_EXISTING: "true"
          KEYWORDS: bassrig super vintage,super vintage bassrig,bassrig fifteen,bassrig fifteen bass preamp
        run: python royalist_watch.py --minutes 55

      - name: Save what we have seen
        if: always()
        run: |
          git config user.name "bassrig-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state/bassrig-seen.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
