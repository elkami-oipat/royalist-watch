name: royalist-watch

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: royalist-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Tori for new listings
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STATE_FILE: state/seen.json
          KEYWORDS: royalist
        run: python royalist_watch.py --once

      - name: Save what we have seen
        run: |
          git config user.name "royalist-watch"
          git config user.email "actions@users.noreply.github.com"
          git add state/seen.json
          if git diff --staged --quiet; then
            echo "nothing changed"
          else
            git commit -m "state: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash
            git push
          fi
